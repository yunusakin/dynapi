name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Spectra specifications
        run: ./spectra/bin/spectra check

      - name: Demo boundary checks
        run: bash scripts/check-demo-boundary.sh
